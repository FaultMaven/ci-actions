name: Lockfile audit
description: >-
  Audits pnpm-lock.yaml with `pnpm audit` at moderate and above, retrying only
  while npm's advisory endpoint is unreachable or failing. audit.sh sets the
  level that the callers' PR gate and daily scheduled-audit.yml both run; step
  names and docs that state it change with it (faultmaven#2159). Run it in a
  checkout of the repository whose lockfile it audits, after pnpm is set up.
inputs:
  on-unreachable:
    description: >-
      `fail` or `warn`: what to do when npm's advisory endpoint stays
      unreachable after every attempt, so that no audit ran.
    required: true
outputs:
  result:
    description: clean, advisories, error or unreachable.
    value: ${{ steps.audit.outputs.result }}
runs:
  using: composite
  steps:
    - id: audit
      shell: bash
      env:
        ON_UNREACHABLE: ${{ inputs.on-unreachable }}
        # Fail each attempt fast; audit.sh owns the retries and the backoff.
        npm_config_fetch_retries: '0'
      run: bash "$GITHUB_ACTION_PATH/audit.sh"
