name: Update image queue
description: >-
  Record a service's new image tag on faultmaven-enterprise-infra's image-queue
  branch, moving the queue only forward.
inputs:
  service:
    description: The queue file's name under available-images/staging/, for example faultmaven-dashboard.
    required: true
  sha:
    description: The full commit sha the image was built from.
    required: true
  token:
    description: >-
      An installation token of the faultmaven-infra-queue-bot App, scoped to
      faultmaven-enterprise-infra. The caller mints it, so the App's private
      key never reaches this action.
    required: true
  github-token:
    description: A token that reads this repository's commits, for the compare that orders the queue.
    required: false
    default: ${{ github.token }}
  path:
    description: Where to check out image-queue, relative to the workspace.
    required: false
    default: .image-queue
runs:
  using: composite
  steps:
    - name: Check out image-queue
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: FaultMaven/faultmaven-enterprise-infra
        # The queue's own branch, never main: a push to it runs nothing.
        ref: image-queue
        token: ${{ inputs.token }}
        path: ${{ inputs.path }}

    - name: Install yq
      shell: bash
      run: bash --noprofile --norc -eo pipefail "$GITHUB_ACTION_PATH/install-yq.sh"

    # One step, because a retry has to recompute the decision against origin's
    # entry, not re-push an old one. Every value is bound through env:, never
    # interpolated into the script.
    - name: Update and push the queue file
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        SERVICE_NAME: ${{ inputs.service }}
        RUN_SHA: ${{ inputs.sha }}
        REPO: ${{ github.repository }}
        GH_TOKEN: ${{ inputs.github-token }}
        TRIGGERED_BY: ${{ github.actor }}
        WORKFLOW_NAME: ${{ github.workflow }}
        GIT_AUTHOR_NAME: faultmaven-infra-queue-bot[bot]
        GIT_AUTHOR_EMAIL: faultmaven-infra-queue-bot[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: faultmaven-infra-queue-bot[bot]
        GIT_COMMITTER_EMAIL: faultmaven-infra-queue-bot[bot]@users.noreply.github.com
      run: bash --noprofile --norc -eo pipefail "$GITHUB_ACTION_PATH/update.sh"
