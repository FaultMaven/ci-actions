name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # This repository's own gate is its lint-workflows action, so the
      # action runs on every change.
      - name: actionlint
        uses: ./lint-workflows

      # actionlint reads workflows only, so the actions' scripts and the
      # tests are linted here.
      - name: shellcheck
        run: shellcheck -S warning update-image-queue/*.sh lockfile-audit/*.sh setup-js/*.sh lint-workflows/*.sh tests/*.sh

  test:
    name: Test the actions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same yq the action installs.
      - name: Install yq
        run: bash --noprofile --norc -eo pipefail update-image-queue/install-yq.sh

      - name: Test update-image-queue
        run: tests/test-update-image-queue.sh

      - name: Test lockfile-audit
        run: tests/test-lockfile-audit.sh

      - name: Test setup-js
        run: tests/test-setup-js.sh

      - name: Test lint-workflows
        run: tests/test-lint-workflows.sh

  # setup-js for real: a fixture package.json declares Node 24 and pnpm 9.15.9,
  # and each mode must set up exactly those, and install only when asked. The
  # fixture's one dependency is a link: to a local directory, so an install
  # writes node_modules without reaching the registry.
  setup-js:
    name: setup-js (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: install
            pnpm: 'true'
            install: 'true'
          - mode: no-install
            pnpm: 'true'
            install: 'false'
          - mode: node-only
            pnpm: 'false'
            install: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Put the fixture at the workspace root
        run: cp tests/fixtures/js/package.json tests/fixtures/js/pnpm-lock.yaml .

      - uses: ./setup-js
        with:
          pnpm: ${{ matrix.pnpm }}
          install: ${{ matrix.install }}

      - name: Node and pnpm are the fixture's
        env:
          WANT_PNPM: ${{ matrix.pnpm }}
          WANT_INSTALL: ${{ matrix.install }}
        run: |
          set -euo pipefail
          node --version
          [[ "$(node --version)" == v24.* ]] || { echo "::error::node is $(node --version), not 24.x"; exit 1; }
          if [ "$WANT_PNPM" = true ]; then
            [ "$(pnpm --version)" = 9.15.9 ] || { echo "::error::pnpm is $(pnpm --version), not 9.15.9"; exit 1; }
          fi
          if [ "$WANT_INSTALL" = true ]; then
            [ -f node_modules/.modules.yaml ] && [ -L node_modules/setup-js-fixture-dep ] || { echo "::error::no install ran"; exit 1; }
          else
            [ ! -e node_modules ] || { echo "::error::an install ran with install: false"; exit 1; }
          fi

  # actionlint checks a local action's inputs at every call site, and a
  # remote one's not at all, so this job calls the action the way callers do.
  # It never runs.
  inputs:
    name: Action inputs (never runs)
    if: ${{ false }}
    runs-on: ubuntu-24.04
    steps:
      - uses: ./update-image-queue
        with:
          service: faultmaven
          sha: ${{ github.sha }}
          token: ${{ github.token }}
      - uses: ./lockfile-audit
        with:
          on-unreachable: fail
      - uses: ./setup-js
        with:
          pnpm: 'true'
          install: 'false'
      - uses: ./lint-workflows
