# Dependabot configuration: version updates for the GitHub Actions this
# repository pins, in its workflows and inside its composite actions.
version: 2
updates:
  # Every action is pinned to a commit sha with its release in a comment.
  # Dependabot raises no security alert for an action pinned that way, so
  # this entry is the only signal that one has a new release. Majors are
  # grouped apart, so a breaking major cannot hold back a patch.
  - package-ecosystem: "github-actions"
    directories: ["/", "/update-image-queue"]
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      actions-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: "chore(deps)"
